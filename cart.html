<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLUSHO - Cart</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #fff;
        }

        /* NAVBAR */

        .nav {
            height: 60px;
            width: 100%;
            background-color: pink;

            display: flex;
            align-items: center;
        }

        .nav h1 {
            padding-left: 50px;
            font-family: Georgia, serif;
            font-size: 36px;
            margin: 0;
        }

        .back-home {
            margin-left: auto;
            margin-right: 40px;
        }

        .back-home a {
            text-decoration: none;
            color: black;
            font-size: 16px;
            font-weight: bold;
        }

        .back-home a:hover {
            color: #e80071;
        }

        /* CART */

        .cart-container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        .cart-container h2 {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 32px;
            margin-bottom: 35px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;

            padding: 20px;
            margin-bottom: 20px;

            border: 1px solid #eee;
            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }

        .item-details {
            flex: 1;
        }

        .item-details h3 {
            margin: 0 0 10px;
            font-size: 20px;
        }

        .item-details p {
            margin: 5px 0;
            font-weight: bold;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .quantity button {
            width: 30px;
            height: 30px;

            border: none;
            border-radius: 5px;

            background: #e80071;
            color: white;

            font-size: 18px;
            cursor: pointer;
        }

        .quantity span {
            font-weight: bold;
            min-width: 25px;
            text-align: center;
        }

        .remove-btn {
            border: none;
            background: #ffdddd;
            color: #d00000;

            padding: 10px 15px;
            border-radius: 6px;

            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn:hover {
            background: #ffbaba;
        }

        /* SUMMARY */

        .cart-summary {
            margin-top: 35px;
            padding: 25px;

            border-radius: 12px;
            background: #fff0f6;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
        }

        .checkout-btn {
            border: none;
            background: #e80071;
            color: white;

            padding: 13px 30px;
            border-radius: 7px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .checkout-btn:hover {
            background: #c90061;
        }

        /* EMPTY CART */

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart i {
            font-size: 70px;
            color: #e80071;
        }

        .empty-cart h3 {
            font-size: 25px;
        }

        .shop-btn {
            display: inline-block;

            text-decoration: none;
            background: #e80071;
            color: white;

            padding: 12px 25px;
            border-radius: 7px;

            font-weight: bold;
        }

        .shop-btn:hover {
            background: #c90061;
        }

        @media(max-width:600px) {

            .nav h1 {
                padding-left: 20px;
            }

            .back-home {
                margin-right: 20px;
            }

            .cart-item {
                flex-direction: column;
                text-align: center;
            }

            .cart-summary {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

   

    <div class="nav">

        <h1>BLUSHO</h1>

        <div class="back-home">
            <a href="index.html">
                <i class="ri-arrow-left-line"></i>
                Continue Shopping
            </a>
        </div>

    </div>


  

    <div class="cart-container">

        <h2>My Cart</h2>

        <div id="cart-items"></div>

        <div id="cart-summary"></div>

    </div>


    <script>

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems = document.querySelector("#cart-items");
        const cartSummary = document.querySelector("#cart-summary");


      

        function displayCart() {

            cartItems.innerHTML = "";

            if (cart.length === 0) {

                cartItems.innerHTML = `
                    <div class="empty-cart">

                        <i class="ri-shopping-bag-line"></i>

                        <h3>Your cart is empty</h3>

                        <p>Add some beauty products to your cart.</p>

                        <a href="index.html" class="shop-btn">
                            Shop Now
                        </a>

                    </div>
                `;

                cartSummary.innerHTML = "";

                return;
            }


            cart.forEach((item, index) => {

                cartItems.innerHTML += `

                    <div class="cart-item">

                        <img src="${item.image}" alt="${item.name}">

                        <div class="item-details">

                            <h3>${item.name}</h3>

                            <p>Price: ₹${item.price}</p>

                            <div class="quantity">

                                <button onclick="decreaseQuantity(${index})">
                                    -
                                </button>

                                <span>${item.quantity}</span>

                                <button onclick="increaseQuantity(${index})">
                                    +
                                </button>

                            </div>

                        </div>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">

                            <i class="ri-delete-bin-line"></i>
                            Remove

                        </button>

                    </div>

                `;
            });


            updateSummary();
        }


   

        function increaseQuantity(index) {

            cart[index].quantity++;

            saveCart();
        }



        function decreaseQuantity(index) {

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            } else {

                cart.splice(index, 1);

            }

            saveCart();
        }


      

        function removeItem(index) {

            cart.splice(index, 1);

            saveCart();
        }


   

        function saveCart() {

            localStorage.setItem("cart", JSON.stringify(cart));

            displayCart();
        }


     

        function updateSummary() {

            let total = 0;

            cart.forEach(item => {

                total += item.price * item.quantity;

            });


            cartSummary.innerHTML = `

                <div class="cart-summary">

                    <div class="total">
                        Total: ₹${total}
                    </div>

                    <button
                        class="checkout-btn"
                        onclick="checkout()">

                        Proceed to Checkout

                    </button>

                </div>

            `;
        }


     

        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;
            }

            window.location.href = "sign.html";
        }


        displayCart();

    </script>

</body>
</html>
